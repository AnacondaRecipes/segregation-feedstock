{% set name = "segregation" %}
{% set version = "2.6.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/pysal/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 66fea9e97c0c3580211e16d6e66a801d2a1179a316f927030ac7f239db5f5b13

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<312]

requirements:
  host:
    - setuptools >=61.0
    - setuptools-scm >=6.2
    - python
    - pip
    - wheel
  run:
    - python
    - geopandas >=1.1.0
    - joblib >=1.5.0
    - libpysal >=4.12.1
    - mapclassify >=2.8
    - matplotlib >=3.10
    - numba >=0.60
    - numpy >=2.0.0
    - pandas >=2.3.0
    - pyproj >=3
    - scikit-learn >=1.5.0
    - scipy >=1.14.0
    - statsmodels >=0.14.4
    - seaborn
    - tqdm

# Skipped files that import pandarm that is absent from the main channel
{% set test_files_to_skip = "--ignore=segregation/tests/test_multiscalar_profile.py" %}
{% set test_files_to_skip = test_files_to_skip + " --ignore=segregation/tests/test_network.py" %}
{% set test_files_to_skip = test_files_to_skip + " --deselect=segregation/tests/test_inference.py::Inference_Tester::test_Inference" %}
test:
  source_files:
    - segregation/tests
  imports:
    - segregation
    - segregation.batch
    - segregation.decomposition
    - segregation.dynamics
    - segregation.inference
    - segregation.inference.comparative
    - segregation.local
    - segregation.multigroup
    - segregation.network
    - segregation.singlegroup
  requires:
    - pip
    - pytest
    - quilt3 # [py<314]
    - matplotlib
    - ipywidgets
  commands:
    - pip check
    - pytest segregation/tests -vv {{ test_files_to_skip }}  # [not win]
    # Windows test is skipped due to np.testing.assert_almost_equal(index.statistic, 0.5456349992598081) failure
    - pytest segregation/tests -vv {{ test_files_to_skip }} -k "not test_Multi_Gini_Seg"  # [win]

about:
  home: https://pysal.org
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: Segregation Measures Framework in PySAL
  description: |
    The PySAL segregation module allow users to estimate several segregation measures and perform 
    inference for single measures and comparative inference in a concise way.
  doc_url: https://pysal.org/segregation
  dev_url: https://github.com/pysal/segregation

extra:
  recipe-maintainers:
    - renanxcortes
    - sjsrey
    - knaaptime
